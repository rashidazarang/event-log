<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Event Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/ui.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%232ec5ff'/><path d='M8 22l8-13 8 13M11.5 18h9' stroke='%23131822' stroke-width='2.4' fill='none' stroke-linecap='round'/></svg>">
</head>
<body>

<header class="topbar">
  <a class="brand" href="#/bandeja"><span class="brand-mark"></span>EVENT LOG</a>

  <nav class="nav" id="nav">
    <a href="#/bandeja"   data-view="bandeja">Bandeja<b class="badge" id="bAbiertas">0</b></a>
    <a href="#/tablero"   data-view="tablero">Tablero</a>
    <a href="#/notas"     data-view="notas">Notas</a>
    <a href="#/almacen"   data-view="almacen">Almacén</a>
    <a href="#/feed"      data-view="feed">Feed<b class="badge badge-n" id="bEventos">0</b></a>
    <a href="#/monitores" data-view="monitores">Monitores</a>
    <a href="#/fuentes"   data-view="fuentes">Fuentes</a>
  </nav>

  <div class="topbar-right">
    <label class="search">
      <svg viewBox="0 0 24 24" class="search-ico"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
      <input id="q" type="search" placeholder="Buscar entrada, clave, etiqueta…" autocomplete="off">
      <kbd>/</kbd>
    </label>
    <button class="btn btn-cy" id="nuevo">+ Nueva</button>
    <div class="me"><span class="avatar" style="--a:#2ec5ff">DO</span>
      <span class="me-name">Dana</span></div>
  </div>
</header>

<div class="spacebar" id="spacebar"></div>
<main id="app"><div class="boot">Abriendo el evlog…</div></main>

<aside class="drawer" id="drawer" hidden></aside>
<div class="scrim" id="scrim" hidden></div>
<div class="toast" id="toast" hidden></div>

<script src="/js/charts.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
